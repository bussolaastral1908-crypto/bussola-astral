    <style>
        :root {
            --bg-dark: #060612;
            --bg-card: rgba(15, 15, 38, 0.78);
            --border-card: rgba(139, 92, 246, 0.22);
            --border-focus: #a855f7;
            --accent-purple: #8b5cf6;
            --accent-gold: #fbbf24;
            --text-main: #f3e8ff;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(139, 92, 246, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 85% 80%, rgba(251, 191, 36, 0.1) 0%, transparent 50%);
        }

        .zodiac-wheel-bg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 860px; height: 860px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.18;
            animation: spin 180s linear infinite;
        }

        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-title {
            font-family: 'Cinzel Decorative', 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #d8b4fe 50%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-shadow: 0 0 24px rgba(168, 85, 247, 0.35);
        }

        .logo-sub {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 0.98rem;
            color: var(--text-muted);
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(139, 92, 246, 0.12),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 1.45rem;
            color: #ffffff;
            margin-bottom: 6px;
            text-align: center;
        }

        .card-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 26px;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: 0.3px;
        }

        input {
            width: 100%;
            background: rgba(10, 10, 26, 0.7);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            color: #ffffff;
            font-size: 0.92rem;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            background: rgba(15, 15, 38, 0.9);
        }

        .emsg { font-size: 0.76rem; color: var(--danger); display: none; }
        .field.err input { border-color: var(--danger); }
        .field.err .emsg { display: block; }

        .forgot-row {
            text-align: right;
            margin-top: -6px;
        }

        .forgot-row a {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-row a:hover { color: var(--accent-gold); }

        .btn-submit {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 50%, #d97706 100%);
            border: none;
            border-radius: var(--radius-md);
            color: #ffffff;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.98rem;
            padding: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
            letter-spacing: 1px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(168, 85, 247, 0.6);
        }

        .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }

        .alert {
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 0.84rem;
            display: none;
        }

        .alert.bad { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }
        .alert.ok { display: block; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #6ee7b7; }

        .footer-link {
            text-align: center;
            margin-top: 22px;
            font-size: 0.86rem;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-link a:hover { color: #ffffff; text-decoration: underline; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .modal {
            background: rgba(18, 18, 44, 0.95);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 400px;
            padding: 28px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .modal h3 { font-family: 'Cinzel', serif; font-size: 1.2rem; margin-bottom: 8px; color: #fff; }
        .modal p { font-size: 0.84rem; color: var(--text-muted); margin-bottom: 18px; }
        .modal-btns { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }
        .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #ccc; border-radius: var(--radius-md); padding: 8px 16px; cursor: pointer; }
    </style>
</head>

<!-- Modal Recuperação de Senha -->
<div class="modal-overlay" id="resetModal">
  <div class="modal">
    <h3>Recuperar Senha</h3>
    <p>Informe seu e-mail para receber as instruções de redefinição.</p>
    <div class="field">
      <label for="reset-email">E-mail</label>
      <input type="email" id="reset-email" placeholder="seu@email.com"/>
    </div>
    <div id="reset-alert" class="alert" style="margin-top: 12px;"></div>
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeReset()">Cancelar</button>
      <button class="btn-submit" id="btnReset" onclick="sendReset()" style="padding: 8px 16px; font-size: 0.88rem;">Enviar Link</button>
    </div>
  </div>
</div>

<div class="container">
    <div class="header">
        <h1 class="logo-title">✦ BÚSSOLA ASTRAL ✦</h1>
        <p class="logo-sub">Entrar no seu Mapa Astral</p>
    </div>

    <div class="card">
        <h2 class="card-title">Entrar na sua Conta</h2>
        <p class="card-desc">Informe suas credenciais para continuar</p>

        <form id="loginForm" class="form-grid" novalidate>

            <div class="field" id="f-email">
                <label for="inp-email">E-mail</label>
                <input type="email" id="inp-email" placeholder="seu@email.com" autocomplete="email" required/>
                <div class="emsg">Informe um e-mail válido.</div>
            </div>

            <div class="field" id="f-pass">
                <label for="inp-pass">Senha</label>
                <input type="password" id="inp-pass" placeholder="Sua senha" autocomplete="current-password" required/>
                <div class="emsg">Informe sua senha.</div>
            </div>

            <div class="forgot-row">
                <a href="#" onclick="openReset(); return false;">Esqueci minha senha</a>
            </div>

            <div id="alertBox" class="alert"></div>

            <button type="submit" class="btn-submit" id="btnLogin">✦ Entrar</button>
        </form>

        <div class="footer-link">
            Não tem uma conta? <a href="/cadastro.html">Criar Conta Grátis</a>
        </div>
    </div>
</div>

<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="/js/firebase-client.js"></script>

<script>
function showAlert(msg, type) {
    const el = document.getElementById('alertBox');
    el.innerHTML = msg;
    el.className = 'alert ' + type;
}

function clrAlert() {
    const el = document.getElementById('alertBox');
    el.className = 'alert';
    el.innerHTML = '';
}

function fe(id, show) {
    document.getElementById(id).classList.toggle('err', show);
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clrAlert();

    const email = document.getElementById('inp-email').value.trim();
    const pass = document.getElementById('inp-pass').value;

    let ok = true;
    fe('f-email', !email || !email.includes('@')); if (!email || !email.includes('@')) ok = false;
    fe('f-pass', !pass); if (!pass) ok = false;
    if (!ok) return;

    const btn = document.getElementById('btnLogin');
    btn.disabled = true;
    btn.textContent = 'Entrando... ✦';

    try {
        await loginUser(email, pass);
        showAlert('✓ Login realizado com sucesso! Redirecionando...', 'ok');
        setTimeout(() => window.location.href = '/horoscopo.html', 1000);
    } catch (err) {
        showAlert(err.message || 'E-mail ou senha incorretos.', 'bad');
        btn.disabled = false;
        btn.textContent = '✦ Entrar';
    }
});

// Já logado? Redireciona
if (typeof getActiveProfile === 'function' && getActiveProfile()) {
    window.location.href = '/horoscopo.html';
}

function openReset() {
    document.getElementById('resetModal').classList.add('open');
    document.getElementById('reset-email').focus();
}

function closeReset() {
    document.getElementById('resetModal').classList.remove('open');
    const el = document.getElementById('reset-alert');
    el.className = 'alert';
    el.textContent = '';
}

async function sendReset() {
    const email = document.getElementById('reset-email').value.trim();
    const el = document.getElementById('reset-alert');
    if (!email) {
        el.textContent = 'Informe seu e-mail.';
        el.className = 'alert bad';
        return;
    }

    const btn = document.getElementById('btnReset');
    btn.disabled = true;
    btn.textContent = 'Enviando...';

    try {
        await resetPassword(email);
        el.textContent = '✓ Link enviado com sucesso! Verifique sua caixa de entrada.';
        el.className = 'alert ok';
    } catch (e) {
        el.textContent = 'Erro ao enviar e-mail de redefinição.';
        el.className = 'alert bad';
    }
    btn.disabled = false;
    btn.textContent = 'Enviar Link';
}

document.getElementById('resetModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeReset();
});
</script>
</body>
